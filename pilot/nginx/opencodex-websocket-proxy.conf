proxy_pass http://opencodex_loopback;
proxy_http_version 1.1;

# WebSocket upgrades must not reuse opencodex-proxy.conf: that HTTP/SSE snippet
# deliberately clears Connection and therefore cannot carry an Upgrade.
proxy_set_header Host 127.0.0.1:10100;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# Edge admission terminates here. The loopback OpenCodex must never receive
# Cloudflare or Nginx gateway credentials.
proxy_set_header X-OpenCodex-API-Key "";
proxy_set_header CF-Access-Client-Id "";
proxy_set_header CF-Access-Client-Secret "";
proxy_set_header Cf-Access-Jwt-Assertion "";
proxy_set_header X-OpenCodex-Probe-Id "";

proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
add_header X-Accel-Buffering no always;
add_header X-OpenCodex-Gateway pw-api-v2 always;
