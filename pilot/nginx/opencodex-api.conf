# Coarse overload guards only. OpenCodex owns turn lifecycle, account selection,
# cancellation, and any provider-aware admission; Nginx must not serialize normal
# Codex, multi-device, or subagent traffic through a single global slot.
include /etc/nginx/private/opencodex-api-key-map.conf;

map $opencodex_api_key_valid $opencodex_gateway_rejection_marker {
    0 api-key;
    1 "";
}

map $http_upgrade $opencodex_websocket_upgrade {
    default 0;
    ~*^websocket$ 1;
}

map "$request_method:$opencodex_websocket_upgrade" $opencodex_responses_mode {
    default 0;
    "POST:0" http;
    "POST:1" http;
    "OPTIONS:0" http;
    "GET:1" websocket;
}

map "$request_method:$opencodex_websocket_upgrade" $opencodex_get_websocket {
    default 0;
    "GET:1" 1;
}

limit_conn_zone $server_name zone=opencodex_generation:32k;
limit_conn_zone $server_name zone=opencodex_responses_websocket:32k;
limit_conn_status 429;
limit_conn_zone $server_name zone=opencodex_voice:32k;

upstream opencodex_loopback {
    server 127.0.0.1:10100;
    keepalive 4;
}

server {
    listen 127.0.0.1:18080;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/opencodex_access.log;
    error_log /var/log/nginx/opencodex_error.log warn;

    client_max_body_size 32m;
    client_body_timeout 60s;
    send_timeout 3600s;

    # This root-owned file contains only the opt-in state, never credentials.
    include /etc/nginx/private/opencodex-feature-flags.conf;

    # OpenCodex trusts its loopback bind, so the gateway must enforce its own key.
    # The marker is non-empty only for an origin gateway-key rejection, allowing
    # external tests to distinguish it from a Cloudflare Access 401.
    add_header X-OpenCodex-Gateway-Rejection $opencodex_gateway_rejection_marker always;
    if ($opencodex_api_key_valid = 0) {
        return 401;
    }

    location = /__gateway_health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"opencodex-gateway"}\n';
    }

    location = /v1/models {
        limit_except GET OPTIONS { deny all; }
        include /etc/nginx/snippets/opencodex-proxy.conf;
    }

    location = /v1/responses {
        error_page 418 = @opencodex_responses_websocket;
        if ($opencodex_responses_mode = 0) { return 405; }
        if ($opencodex_responses_mode = websocket) { return 418; }
        limit_conn opencodex_generation 32;
        error_page 429 = @opencodex_generation_limit;
        include /etc/nginx/snippets/opencodex-proxy.conf;
    }

    location @opencodex_responses_websocket {
        internal;
        limit_conn opencodex_responses_websocket 32;
        error_page 429 = @opencodex_responses_websocket_limit;
        include /etc/nginx/snippets/opencodex-websocket-proxy.conf;
    }

    location = /v1/responses/compact {
        limit_except POST OPTIONS { deny all; }
        limit_conn opencodex_generation 32;
        error_page 429 = @opencodex_generation_limit;
        include /etc/nginx/snippets/opencodex-proxy.conf;
    }

    location = /v1/images/generations {
        limit_except POST OPTIONS { deny all; }
        limit_conn opencodex_generation 32;
        error_page 429 = @opencodex_generation_limit;
        include /etc/nginx/snippets/opencodex-proxy.conf;
    }

    location = /v1/images/edits {
        limit_except POST OPTIONS { deny all; }
        limit_conn opencodex_generation 32;
        error_page 429 = @opencodex_generation_limit;
        include /etc/nginx/snippets/opencodex-proxy.conf;
    }

    location ~ ^/v1/opencodex/artifacts/[^/]+$ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/opencodex-proxy.conf;
    }

    location = /v1/alpha/search {
        limit_except POST OPTIONS { deny all; }
        limit_conn opencodex_generation 32;
        error_page 429 = @opencodex_generation_limit;
        include /etc/nginx/snippets/opencodex-proxy.conf;
    }

    location = /v1/live {
        if ($opencodex_voice_enabled != 1) { return 404; }
        limit_except POST OPTIONS { deny all; }
        limit_conn opencodex_voice 1;
        error_page 429 = @opencodex_voice_limit;
        include /etc/nginx/snippets/opencodex-proxy.conf;
    }

    location = /v1/realtime/calls {
        if ($opencodex_voice_enabled != 1) { return 404; }
        limit_except POST OPTIONS { deny all; }
        limit_conn opencodex_voice 1;
        error_page 429 = @opencodex_voice_limit;
        include /etc/nginx/snippets/opencodex-proxy.conf;
    }

    location ~ ^/v1/live/[^/]+$ {
        if ($opencodex_voice_enabled != 1) { return 404; }
        if ($opencodex_get_websocket = 0) { return 405; }
        limit_conn opencodex_voice 1;
        error_page 429 = @opencodex_voice_limit;
        include /etc/nginx/snippets/opencodex-websocket-proxy.conf;
    }

    location = /v1/realtime {
        if ($opencodex_voice_enabled != 1) { return 404; }
        if ($opencodex_get_websocket = 0) { return 405; }
        limit_conn opencodex_voice 1;
        error_page 429 = @opencodex_voice_limit;
        include /etc/nginx/snippets/opencodex-websocket-proxy.conf;
    }

    location ~ ^/v1/realtime/calls/[^/]+$ {
        if ($opencodex_voice_enabled != 1) { return 404; }
        if ($opencodex_get_websocket = 0) { return 405; }
        limit_conn opencodex_voice 1;
        error_page 429 = @opencodex_voice_limit;
        include /etc/nginx/snippets/opencodex-websocket-proxy.conf;
    }

    # Only a local emergency limit_conn rejection reaches these handlers. Upstream
    # 429 responses pass through because proxy_intercept_errors remains disabled.
    location @opencodex_generation_limit {
        internal;
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-OpenCodex-Concurrency-Limit 32 always;
        add_header X-OpenCodex-Probe-Id $http_x_opencodex_probe_id always;
        return 429 '{"error":{"type":"gateway_safety_limit","message":"Gateway generation safety ceiling reached."}}\n';
    }

    location @opencodex_responses_websocket_limit {
        internal;
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-OpenCodex-WebSocket-Concurrency-Limit 32 always;
        return 429 '{"error":{"type":"gateway_websocket_safety_limit","message":"Gateway Responses WebSocket safety ceiling reached."}}\n';
    }

    location @opencodex_voice_limit {
        internal;
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-OpenCodex-Voice-Concurrency-Limit 1 always;
        return 429 '{"error":{"type":"gateway_voice_concurrency_limit","message":"Only one voice session may be active."}}\n';
    }

    location / {
        return 404;
    }
}
