version: 2
updates:
  - package-ecosystem: gomod
    directory: /client/relay
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /containers/opencodex
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
