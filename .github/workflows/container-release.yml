name: Publish experimental OpenCodex image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      gateway_version:
        description: Exact gateway version, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'novelKR/OpenCodex-OCI-Gateway' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve exact versions
        id: version
        env:
          INPUT_VERSION: ${{ inputs.gateway_version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          tools/verify-release-ref.sh "$version"
          python3 tools/opencodex_upstream.py verify-tree \
            --container containers/opencodex \
            --verify-provenance
          opencodex_version="$(
            jq -er '
              .dependencies["@bitkyc08/opencodex"]
              | select(
                  type == "string"
                  and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")
                )
            ' containers/opencodex/package.json
          )"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'opencodex=%s\n' "$opencodex_version" >> "$GITHUB_OUTPUT"
          printf 'opencodex_revision=%s\n' "$(jq -er .revision containers/opencodex/upstream.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: containers/opencodex
          file: containers/opencodex/Dockerfile
          target: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/novelkr/opencodex-oci-gateway:${{ steps.version.outputs.value }}-ocx-${{ steps.version.outputs.opencodex }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.value }}
            OPENCODEX_VERSION=${{ steps.version.outputs.opencodex }}
            OPENCODEX_REVISION=${{ steps.version.outputs.opencodex_revision }}
            PUBLIC_CORE_REVISION=${{ github.sha }}
      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/novelkr/opencodex-oci-gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable digest
        run: printf '%s@%s\n' 'ghcr.io/novelkr/opencodex-oci-gateway' '${{ steps.build.outputs.digest }}'
