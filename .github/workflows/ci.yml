name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: client/relay/go.sum
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Shell syntax
        run: bash -n pilot/scripts/*.sh pilot/libexec/* ops/oci/*.sh client/relay/scripts/*.sh tools/*.sh
      - name: Deployment and pilot tests
        run: |
          test_tmp="/opencodex-ci-tmp.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$test_tmp"
          trap 'sudo rmdir -- "$test_tmp"' EXIT
          TMPDIR="$test_tmp" python3 -m unittest discover -s pilot/tests -p 'test_*.py'
      - name: Go test, race, and vet
        working-directory: client/relay
        run: |
          test_tmp="/opencodex-go-ci-tmp.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$test_tmp"
          trap 'sudo rmdir -- "$test_tmp"' EXIT
          TMPDIR="$test_tmp" go test ./...
          TMPDIR="$test_tmp" go test -race ./...
          TMPDIR="$test_tmp" go vet ./...
      - name: Public hygiene
        run: tools/check-public-checkout.sh HEAD
      - name: Diff whitespace
        run: git diff --check

  macos:
    if: github.event.repository.private == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: client/relay/go.sum
      - name: Reproduce reviewed teardown profiles
        run: client/relay/scripts/review-teardown-profiles.py --check
      - name: Swift test and build
        working-directory: client/relay/macos/OpenCodexRelay
        run: |
          swift test
          swift build -c release
      - name: Dry-run the production release package
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/relay-release-dry-run"
          extract_root="${RUNNER_TEMP}/relay-release-dry-run-extract"
          signing_key="${RUNNER_TEMP}/relay-release-dry-run.pem"
          signing_public_key="${RUNNER_TEMP}/relay-release-dry-run.pub"
          signature_bin="${RUNNER_TEMP}/relay-release-dry-run.sig"
          cleanup() {
            rm -rf -- "$release_root" "$extract_root"
            rm -f -- "$signing_key" "$signing_public_key" "$signature_bin"
          }
          trap cleanup EXIT
          openssl genpkey -algorithm ED25519 -out "$signing_key"
          openssl pkey -in "$signing_key" -pubout -out "$signing_public_key"
          release_build_number="$(sed -n '1p' client/relay/RELEASE_BUILD_NUMBER)"
          ./client/relay/scripts/build-release.sh 0.3.8-rc.7 \
            --github-repo novelKR/OpenCodex-OCI-Gateway \
            --signing-key "$signing_key" \
            --previous-build-number 1000 \
            --output "$release_root"
          manifest="${release_root}/manifest-0.3.8-rc.7.json"
          base64 -D < "${release_root}/manifest-0.3.8-rc.7.sig" > "$signature_bin"
          openssl pkeyutl -verify -pubin -inkey "$signing_public_key" -rawin \
            -in "$manifest" -sigfile "$signature_bin"
          python3 - "$release_root" "$manifest" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          release_root = pathlib.Path(sys.argv[1])
          manifest = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          if manifest.get("compatibility_revision") != 5:
              raise SystemExit("dry-run manifest is not revision 5")
          if manifest.get("channel") != "preview":
              raise SystemExit("dry-run manifest channel mismatch")
          if manifest.get("minimum_updater_version") != "0.3.8-rc.6":
              raise SystemExit("dry-run minimum updater mismatch")
          if not isinstance(manifest.get("trust_key_id"), str) or len(manifest["trust_key_id"]) != 64:
              raise SystemExit("dry-run trust key ID is invalid")
          matches = [
              artifact for artifact in manifest.get("artifacts", [])
              if artifact.get("component") == "macos_menu_bar_bundle"
          ]
          if len(matches) != 1:
              raise SystemExit("dry-run manifest has no unique app artifact")
          app_artifact = matches[0]
          if app_artifact.get("minimum_macos_version") != "26.0":
              raise SystemExit("dry-run minimum macOS mismatch")
          if app_artifact.get("integration_protocol") != 1 or app_artifact.get("helper_protocol") != 1:
              raise SystemExit("dry-run protocol metadata mismatch")
          archive = release_root / "OpenCodexRelay.app.zip"
          if app_artifact.get("file") != archive.name:
              raise SystemExit("dry-run manifest app filename mismatch")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != app_artifact.get("sha256"):
              raise SystemExit("dry-run app archive hash mismatch")
          PY
          ditto -x -k "${release_root}/OpenCodexRelay.app.zip" "$extract_root"
          app="${extract_root}/OpenCodexRelay.app"
          plist="${app}/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$release_build_number" ]]
          tracked_key="config/trust/opencodex-relay-release-ed25519.pub"
          bundled_key="${app}/Contents/Resources/ReleaseTrust/opencodex-relay-release-ed25519.pub"
          tracked_der="${RUNNER_TEMP}/relay-release-dry-run-tracked.der"
          bundled_der="${RUNNER_TEMP}/relay-release-dry-run-bundled.der"
          cmp -s "$tracked_key" "$bundled_key"
          openssl pkey -pubin -in "$tracked_key" -outform DER > "$tracked_der"
          openssl pkey -pubin -in "$bundled_key" -outform DER > "$bundled_der"
          [[ "$(shasum -a 256 "$tracked_der" | awk '{print $1}')" == \
             "$(shasum -a 256 "$bundled_der" | awk '{print $1}')" ]]
          [[ "$(shasum -a 256 "$tracked_der" | awk '{print $1}')" == \
             "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["trust_key_id"])' "$manifest")" ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          for component in \
            "$app" \
            "${app}/Contents/MacOS/OpenCodexRelay" \
            "${app}/Contents/Library/Helpers/opencodex-relay" \
            "${app}/Contents/Library/Helpers/opencodex-relayctl" \
            "${app}/Contents/Library/Helpers/OpenCodexRelayHelperInstaller" \
            "${app}/Contents/Library/HelperTools/OpenCodexRelayPrivilegedHelper"; do
            details="$(codesign -dvvv --verbose=4 "$component" 2>&1)"
            grep -Fx 'Signature=adhoc' <<<"$details" >/dev/null
            grep -Fx 'TeamIdentifier=not set' <<<"$details" >/dev/null
            grep -E '^CodeDirectory .*flags=.*\(.*runtime.*\)' <<<"$details" >/dev/null
            if [[ -f "$component" ]]; then
              [[ "$(lipo -archs "$component")" == arm64 ]]
            fi
          done
          (
            cd client/relay
            OPENCODEX_STAGE_APP_FIXTURE="$app" \
            OPENCODEX_STAGE_ARCHIVE_FIXTURE="${release_root}/OpenCodexRelay.app.zip" \
            OPENCODEX_STAGE_TAG=0.3.8-rc.7 \
            OPENCODEX_STAGE_PUBLIC_KEY="${GITHUB_WORKSPACE}/config/trust/opencodex-relay-release-ed25519.pub" \
            OPENCODEX_STAGE_CURRENT_BUILD=1000 \
              go test ./internal/release -run '^(TestExtractReleaseArchiveDryRunFixture|TestSystemAppBundleValidatorDryRunFixture)$'
          )
