name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: client/relay/go.sum
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Shell syntax
        run: bash -n pilot/scripts/*.sh pilot/libexec/* ops/oci/*.sh client/relay/scripts/*.sh tools/*.sh
      - name: Deployment and pilot tests
        run: |
          test_tmp="/opencodex-ci-tmp.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$test_tmp"
          cleanup() {
            sudo find "$test_tmp" -depth -mindepth 1 -delete
            sudo rmdir -- "$test_tmp"
          }
          trap cleanup EXIT
          TMPDIR="$test_tmp" python3 -m unittest discover -s pilot/tests -p 'test_*.py'
      - name: Go test, race, and vet
        working-directory: client/relay
        run: |
          test_tmp="/opencodex-go-ci-tmp.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$test_tmp"
          cleanup() {
            sudo find "$test_tmp" -depth -mindepth 1 -delete
            sudo rmdir -- "$test_tmp"
          }
          trap cleanup EXIT
          TMPDIR="$test_tmp" go test ./...
          TMPDIR="$test_tmp" go test -race ./...
          TMPDIR="$test_tmp" go vet ./...
      - name: Public hygiene
        run: tools/check-public-checkout.sh HEAD
      - name: Diff whitespace
        run: git diff --check

  macos:
    if: github.event.repository.private == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: client/relay/go.sum
      - name: Reproduce reviewed teardown profiles
        run: client/relay/scripts/review-teardown-profiles.py --check
      - name: Swift test and build
        working-directory: client/relay/macos/OpenCodexRelay
        run: |
          swift test
          swift build -c release -Xswiftc -warnings-as-errors
      - name: Isolated file-Keychain ACL integration
        run: client/relay/scripts/test-keychain-acl-integration.sh
      - name: Dry-run the production release package
        run: |
          set -euo pipefail
          release_root="${RUNNER_TEMP}/relay-release-dry-run"
          extract_root="${RUNNER_TEMP}/relay-release-dry-run-extract"
          signing_key="${RUNNER_TEMP}/relay-release-dry-run.pem"
          signing_public_key="${RUNNER_TEMP}/relay-release-dry-run.pub"
          signature_bin="${RUNNER_TEMP}/relay-release-dry-run.sig"
          cleanup() {
            rm -rf -- "$release_root" "$extract_root"
            rm -f -- "$signing_key" "$signing_public_key" "$signature_bin"
          }
          trap cleanup EXIT
          openssl genpkey -algorithm ED25519 -out "$signing_key"
          openssl pkey -in "$signing_key" -pubout -out "$signing_public_key"
          release_build_number="$(sed -n '1p' client/relay/RELEASE_BUILD_NUMBER)"
          ./client/relay/scripts/build-release.sh 0.3.8-rc.11 \
            --github-repo novelKR/OpenCodex-OCI-Gateway \
            --signing-key "$signing_key" \
            --previous-build-number 1004 \
            --output "$release_root"
          manifest="${release_root}/manifest-0.3.8-rc.11.json"
          base64 -D < "${release_root}/manifest-0.3.8-rc.11.sig" > "$signature_bin"
          openssl pkeyutl -verify -pubin -inkey "$signing_public_key" -rawin \
            -in "$manifest" -sigfile "$signature_bin"
          python3 - "$release_root" "$manifest" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          release_root = pathlib.Path(sys.argv[1])
          manifest = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          if manifest.get("compatibility_revision") != 5:
              raise SystemExit("dry-run manifest is not revision 5")
          if manifest.get("channel") != "preview":
              raise SystemExit("dry-run manifest channel mismatch")
          if manifest.get("minimum_updater_version") != "0.3.8-rc.6":
              raise SystemExit("dry-run minimum updater mismatch")
          if not isinstance(manifest.get("trust_key_id"), str) or len(manifest["trust_key_id"]) != 64:
              raise SystemExit("dry-run trust key ID is invalid")
          matches = [
              artifact for artifact in manifest.get("artifacts", [])
              if artifact.get("component") == "macos_menu_bar_bundle"
          ]
          if len(matches) != 1:
              raise SystemExit("dry-run manifest has no unique app artifact")
          app_artifact = matches[0]
          if app_artifact.get("minimum_macos_version") != "26.0":
              raise SystemExit("dry-run minimum macOS mismatch")
          if app_artifact.get("integration_protocol") != 1 or app_artifact.get("helper_protocol") != 1:
              raise SystemExit("dry-run protocol metadata mismatch")
          archive = release_root / "OpenCodexRelay.app.zip"
          if app_artifact.get("file") != archive.name:
              raise SystemExit("dry-run manifest app filename mismatch")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != app_artifact.get("sha256"):
              raise SystemExit("dry-run app archive hash mismatch")
          PY
          ditto -x -k "${release_root}/OpenCodexRelay.app.zip" "$extract_root"
          app="${extract_root}/OpenCodexRelay.app"
          plist="${app}/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$release_build_number" ]]
          tracked_key="config/trust/opencodex-relay-release-ed25519.pub"
          bundled_key="${app}/Contents/Resources/ReleaseTrust/opencodex-relay-release-ed25519.pub"
          tracked_der="${RUNNER_TEMP}/relay-release-dry-run-tracked.der"
          bundled_der="${RUNNER_TEMP}/relay-release-dry-run-bundled.der"
          cmp -s "$tracked_key" "$bundled_key"
          openssl pkey -pubin -in "$tracked_key" -outform DER > "$tracked_der"
          openssl pkey -pubin -in "$bundled_key" -outform DER > "$bundled_der"
          [[ "$(shasum -a 256 "$tracked_der" | awk '{print $1}')" == \
             "$(shasum -a 256 "$bundled_der" | awk '{print $1}')" ]]
          [[ "$(shasum -a 256 "$tracked_der" | awk '{print $1}')" == \
             "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["trust_key_id"])' "$manifest")" ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          for component in \
            "$app" \
            "${app}/Contents/MacOS/OpenCodexRelay" \
            "${app}/Contents/Library/Helpers/opencodex-relay" \
            "${app}/Contents/Library/Helpers/opencodex-relayctl" \
            "${app}/Contents/Library/Helpers/OpenCodexRelayHelperInstaller" \
            "${app}/Contents/Library/HelperTools/OpenCodexRelayPrivilegedHelper"; do
            details="$(codesign -dvvv --verbose=4 "$component" 2>&1)"
            grep -Fx 'Signature=adhoc' <<<"$details" >/dev/null
            grep -Fx 'TeamIdentifier=not set' <<<"$details" >/dev/null
            grep -E '^CodeDirectory .*flags=.*\(.*runtime.*\)' <<<"$details" >/dev/null
            if [[ -f "$component" ]]; then
              [[ "$(lipo -archs "$component")" == arm64 ]]
            fi
          done
          (
            cd client/relay
            OPENCODEX_STAGE_APP_FIXTURE="$app" \
            OPENCODEX_STAGE_ARCHIVE_FIXTURE="${release_root}/OpenCodexRelay.app.zip" \
            OPENCODEX_STAGE_TAG=0.3.8-rc.11 \
            OPENCODEX_STAGE_PUBLIC_KEY="${GITHUB_WORKSPACE}/config/trust/opencodex-relay-release-ed25519.pub" \
            OPENCODEX_STAGE_CURRENT_BUILD=1004 \
              go test ./internal/release -run '^(TestExtractReleaseArchiveDryRunFixture|TestSystemAppBundleValidatorDryRunFixture)$'
          )

  runtime-image:
    name: runtime-image
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILDX_DOWNLOAD_URL: https://github.com/docker/buildx/releases/download/v0.30.1/buildx-v0.30.1.linux-amd64
      BUILDX_SHA256: c37114fcd034025ec68e224657c8a5a850df472ded3ddcbca75ad3a7ebb9710d
      BUILDX_VERSION_OUTPUT: github.com/docker/buildx v0.30.1 9e66234aa13328a5e75b75aa5574e1ca6d6d9c01
      BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.26.1@sha256:8290a3b1183f45fb0c7ccd2faa7aa88eeb9af0ea85ff54458cbd8cbdb576e721
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether the runtime image contract applies
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          applicable=false
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            if git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA" | python3 -c '
          import sys
          prefixes = (
              ".github/workflows/ci.yml",
              ".github/workflows/opencodex-",
              "containers/opencodex/",
              "tools/opencodex_",
              "tools/verify_npm_slsa_identity.cjs",
              "pilot/tests/test_opencodex_",
              "config/trust/opencodex-runtime-release-ed25519.pub",
          )
          paths = [item.decode("utf-8") for item in sys.stdin.buffer.read().split(b"\0") if item]
          raise SystemExit(0 if any(path.startswith(prefixes) for path in paths) else 1)
          '; then
              applicable=true
            fi
          fi
          printf 'applicable=%s\n' "$applicable" >> "$GITHUB_OUTPUT"
          if [[ "$applicable" == false ]]; then
            printf 'runtime-image: not applicable to this pull request\n'
          fi
      - name: Install the reviewed Buildx CLI before first execution
        if: steps.scope.outputs.applicable == 'true'
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          export DOCKER_CONFIG="${RUNNER_TEMP}/opencodex-runtime-docker-config"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          umask 077
          plugin_dir="${DOCKER_CONFIG}/cli-plugins"
          download="${RUNNER_TEMP}/docker-buildx-v0.30.1.download"
          plugin="${plugin_dir}/docker-buildx"
          install -d -m 0700 "$DOCKER_CONFIG" "$plugin_dir"
          [[ ! -e "$download" && ! -L "$download" && ! -e "$plugin" && ! -L "$plugin" ]]
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$download" "$BUILDX_DOWNLOAD_URL"
          [[ "$(sha256sum "$download" | awk '{print $1}')" == "$BUILDX_SHA256" ]]
          install -m 0555 "$download" "$plugin"
          rm -f -- "$download"
          [[ "$(sha256sum "$plugin" | awk '{print $1}')" == "$BUILDX_SHA256" ]]
          [[ "$(docker buildx version)" == "$BUILDX_VERSION_OUTPUT" ]]
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: steps.scope.outputs.applicable == 'true'
        with:
          cache-image: false
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
      - id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.scope.outputs.applicable == 'true'
        with:
          cache-binary: false
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
      - name: Verify the reviewed Buildx binary and BuildKit builder image
        if: steps.scope.outputs.applicable == 'true'
        env:
          BUILDX_NODES: ${{ steps.buildx.outputs.nodes }}
        run: |
          set -euo pipefail
          plugin="${DOCKER_CONFIG}/cli-plugins/docker-buildx"
          [[ -f "$plugin" && ! -L "$plugin" ]]
          [[ "$(sha256sum "$plugin" | awk '{print $1}')" == "$BUILDX_SHA256" ]]
          [[ "$(docker buildx version)" == "$BUILDX_VERSION_OUTPUT" ]]
          node_name="$(python3 -c 'import json,os,re; value=json.loads(os.environ["BUILDX_NODES"]); assert isinstance(value,list) and len(value)==1; name=value[0].get("name"); assert isinstance(name,str) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,127}",name); print(name)')"
          builder_container="buildx_buildkit_${node_name}"
          configured_image="$(docker inspect --format '{{.Config.Image}}' "$builder_container")"
          [[ "$configured_image" == *@sha256:8290a3b1183f45fb0c7ccd2faa7aa88eeb9af0ea85ff54458cbd8cbdb576e721 ]]
          container_image_id="$(docker inspect --format '{{.Image}}' "$builder_container")"
          expected_image_id="$(docker image inspect --format '{{.Id}}' "$BUILDKIT_IMAGE")"
          [[ "$container_image_id" == "$expected_image_id" ]]
      - name: Build and execute both Linux platform contracts without publishing
        if: steps.scope.outputs.applicable == 'true'
        run: |
          set -euo pipefail
          python3 tools/opencodex_upstream.py verify-tree \
            --container containers/opencodex \
            --verify-provenance
          node --test containers/opencodex/bootstrap.test.mjs
          version="$(python3 -c 'import json; print(json.load(open("containers/opencodex/upstream.lock.json"))["version"])')"
          revision="$(python3 -c 'import json; print(json.load(open("containers/opencodex/upstream.lock.json"))["revision"])')"
          image_revision="$(python3 -c 'import json; print(json.load(open("containers/opencodex/upstream.lock.json"))["image_revision"])')"
          artifact_version="${version}-r${image_revision}"
          for architecture in amd64 arm64; do
            image="opencodex-runtime-pr-${architecture}:${GITHUB_SHA}"
            docker buildx build \
              --file containers/opencodex/Dockerfile \
              --target runtime \
              --platform "linux/${architecture}" \
              --provenance=false \
              --sbom=false \
              --load \
              --tag "$image" \
              --build-arg "IMAGE_VERSION=${artifact_version}" \
              --build-arg "OPENCODEX_VERSION=${version}" \
              --build-arg "OPENCODEX_REVISION=${revision}" \
              --build-arg "PUBLIC_CORE_REVISION=${GITHUB_SHA}" \
              containers/opencodex
            python3 tools/opencodex_runtime_image_test.py \
              --image "$image" \
              --expected-version "$version" \
              --expected-artifact-version "$artifact_version" \
              --expected-upstream-revision "$revision" \
              --expected-source-revision "$GITHUB_SHA"
            docker image rm "$image"
          done
          printf 'runtime-image: both linux/amd64 and linux/arm64 contracts passed without a registry push\n'
