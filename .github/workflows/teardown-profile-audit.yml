name: Teardown profile audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 3"

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'novelKR/OpenCodex-OCI-Gateway' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: client/relay/go.sum
      - name: Reproduce registered manifests and report upstream latest
        run: client/relay/scripts/review-teardown-profiles.py --check --audit-latest
