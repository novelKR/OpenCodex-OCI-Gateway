name: Teardown profile audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 3"

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'novelKR/OpenCodex-OCI-Gateway' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reproduce registered manifests and report upstream latest
        run: client/relay/scripts/review-teardown-profiles.py --check --audit-latest
